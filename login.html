<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildwise | Authentication</title>
    <link rel="icon" type="image/png" href="assets/logo/logo.png">
    
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/navbar.css">
    <link rel="stylesheet" href="styles/login.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="scripts/auth.js"></script>
    <script src="scripts/login.js" defer></script>
</head>
<body>

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <main class="login-page-main">
        <div class="login-left">
            <div class="login-left-content">
                <h1>BUILD YOUR VISION WITH US.</h1>
                <p>Access your projects, cost estimates, and builder profile in one seamless environment.</p>
            </div>
        </div>

        <div class="login-right">        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" data-target="login">Login</button>
                <button class="auth-tab" data-target="signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div class="auth-form-container active" id="login-form-container">
                <form class="auth-form" id="login-form">
                    <div class="form-group">
                        <label>Email / Username</label>
                        <div class="form-input-wrapper">
                            <input type="text" id="login-email" required placeholder="name@company.com or admin">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="form-input-wrapper">
                            <input type="password" id="login-password" required placeholder="••••••••">
                            <button type="button" class="password-toggle">Show</button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label>
                            <input type="checkbox" id="login-remember"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-solid auth-btn">Log In</button>
                </form>
            </div>

            <!-- Signup Form -->
            <div class="auth-form-container" id="signup-form-container">
                <form class="auth-form" id="signup-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="form-input-wrapper">
                            <input type="text" id="signup-name" required placeholder="John Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="form-input-wrapper">
                            <input type="email" id="signup-email" required placeholder="name@company.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="form-input-wrapper">
                            <input type="password" id="signup-password" required placeholder="••••••••">
                            <button type="button" class="password-toggle">Show</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="form-input-wrapper">
                            <input type="password" id="signup-confirm" required placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-solid auth-btn">Create Account</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <div id="toast-container"></div>


    <script src="scripts/app.js?v=9"></script>
</body>
</html>
