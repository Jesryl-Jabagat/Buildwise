<style>
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: transparent;
    padding: 18px 32px;
    border-bottom: 1px solid transparent;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    box-sizing: border-box;
    transition: all 0.3s ease;
  }

  .navbar.scrolled {
    background: var(--color-nav-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--color-border);
  }

  .logo {
    color: var(--color-text);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    text-decoration: none;
  }
  
  [data-theme="dark"] .logo {
    color: #ffffff;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-links a {
    color: var(--color-muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    transition: color 0.15s ease;
  }

  .nav-links a:hover {
    color: var(--color-text);
  }

  [data-theme="dark"] .nav-links a {
    color: rgba(255, 255, 255, 0.85);
  }
  
  [data-theme="dark"] .nav-links a:hover {
    color: #ffffff;
  }

  .theme-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-top: 1px solid var(--color-border, rgba(255,255,255,0.06));
    color: var(--color-text, #cfd2d8);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .theme-toggle-row:hover {
    background: color-mix(in srgb, var(--color-accent, #e0a530) 10%, transparent);
    color: var(--color-accent, #e0a530);
  }

  .toggle-switch {
    width: 34px;
    height: 18px;
    background: #4a4d55;
    border-radius: 12px;
    position: relative;
    transition: background 0.3s ease;
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: #ffffff;
    border-radius: 50%;
    transition: transform 0.3s ease;
  }

  .toggle-switch.active {
    background: var(--color-accent, #e0a530);
  }

  .toggle-switch.active::after {
    transform: translateX(16px);
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--color-accent);
    color: var(--color-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .hamburger-menu {
    display: none;
    flex-direction: column;
    justify-content: space-around;
    width: 24px;
    height: 18px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 1001;
  }

  .hamburger-menu span {
    width: 24px;
    height: 2px;
    background: var(--color-text, #333);
    border-radius: 10px;
    transition: all 0.3s linear;
    position: relative;
    transform-origin: 1px;
  }

  [data-theme="dark"] .hamburger-menu span {
    background: #ffffff;
  }

  .hamburger-menu.active span:nth-child(1) {
    transform: rotate(45deg);
  }
  .hamburger-menu.active span:nth-child(2) {
    opacity: 0;
  }
  .hamburger-menu.active span:nth-child(3) {
    transform: rotate(-45deg);
  }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 32px;
    }

  @media (max-width: 768px) {
    .hamburger-menu {
      display: flex;
    }

    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      height: 100vh;
      width: 250px;
      flex-direction: column;
      align-items: flex-start;
      background: var(--color-nav-bg, #ffffff);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-left: 1px solid var(--color-border, #ddd);
      padding-top: 80px;
      padding-left: 32px;
      transition: right 0.3s ease;
      z-index: 999;
      box-shadow: -5px 0 15px rgba(0,0,0,0.1);
      gap: 24px;
    }

    [data-theme="dark"] .nav-menu {
      background: var(--color-nav-bg, #1a1a1a);
      border-left: 1px solid var(--color-border, #333);
      box-shadow: -5px 0 15px rgba(0,0,0,0.5);
    }

    .nav-menu.active {
      right: 0;
    }

    .nav-links {
      flex-direction: column;
      gap: 20px;
    }
  }
</style>

          <a href="/pages/settings.html" class="simple-dropdown-link" id="nav-settings-link">Settings</a>
          <a href="#" class="simple-dropdown-link" id="nav-logout-link" style="color: #e74c3c;">Logout</a>
