<style>
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: transparent;
    padding: 18px 32px;
    border-bottom: 1px solid transparent;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    box-sizing: border-box;
    transition: all 0.3s ease;
  }

  .navbar.scrolled {
    background: var(--color-nav-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--color-border);
  }

  .logo {
    color: var(--color-text);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    text-decoration: none;
  }
  
  [data-theme="dark"] .logo {
    color: #ffffff;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-links a {
    color: var(--color-muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    transition: color 0.15s ease;
  }

  .nav-links a:hover {
    color: var(--color-text);
  }

  [data-theme="dark"] .nav-links a {
    color: rgba(255, 255, 255, 0.85);
  }
  
  [data-theme="dark"] .nav-links a:hover {
    color: #ffffff;
  }

  .theme-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-top: 1px solid var(--color-border, rgba(255,255,255,0.06));
    color: var(--color-text, #cfd2d8);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .theme-toggle-row:hover {
    background: color-mix(in srgb, var(--color-accent, #e0a530) 10%, transparent);
    color: var(--color-accent, #e0a530);
  }

  .toggle-switch {
    width: 34px;
    height: 18px;
    background: #4a4d55;
    border-radius: 12px;
    position: relative;
    transition: background 0.3s ease;
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: #ffffff;
    border-radius: 50%;
    transition: transform 0.3s ease;
  }

  .toggle-switch.active {
    background: var(--color-accent, #e0a530);
  }

  .toggle-switch.active::after {
    transform: translateX(16px);
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--color-accent);
    color: var(--color-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
</style>

<nav class="navbar">
  <a href="/index.html" class="logo" style="display: flex; align-items: center; gap: 10px;">
    <img src="/assets/logo/logo.png" alt="Buildwise Logo" style="height: 32px; width: auto; border-radius: 4px;">
    Buildwise
  </a>
  <div class="nav-right">
    <ul class="nav-links">
      <li><a href="/pages/how-it-works.html">How it works</a></li>
      <li><a href="/pages/about.html">About</a></li>
      <li id="nav-login-link" style="display: none;"><a href="/login.html">Login</a></li>
    </ul>
    <div style="position: relative; display: none;" id="avatar-dropdown-container">
      <div class="avatar" id="simple-avatar-btn">G</div>
      <div class="simple-dropdown-menu" id="simple-dropdown-menu">
        <a href="/pages/profile.html" class="simple-dropdown-link" id="nav-profile-link">Profile</a>
        <a href="/pages/settings.html" class="simple-dropdown-link" id="nav-settings-link">Settings</a>
        <div class="theme-toggle-row" id="theme-toggle-row">
          <span>Dark Mode</span>
          <div class="toggle-switch" id="theme-toggle-switch"></div>
        </div>
      </div>
    </div>
  </div>
</nav>
