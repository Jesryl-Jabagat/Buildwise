<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buildwise | User Reviews</title>
    <link rel="icon" type="image/png" href="../assets/logo/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/reviews.css">
  </head>
  <body>
    <!-- Navbar injected here -->
    <div id="navbar-container"></div>

    <main class="container">
      <section class="reviews-hero">
        <p class="eyebrow">Community</p>
        <h1>What Our Users Say</h1>
        <p class="text-muted">Real feedback from people planning their dream homes with Buildwise.</p>
        
        <div class="reviews-stats" id="reviews-stats" style="display: none;">
          <div class="stat-item">
            <div class="stat-value" id="avg-rating">0.0</div>
            <div class="stat-stars" id="avg-stars">★★★★★</div>
            <div class="stat-label">Average Rating</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="total-reviews">0</div>
            <div class="stat-stars" style="color: transparent;">-</div>
            <div class="stat-label">Total Reviews</div>
          </div>
        </div>
      </section>

      <section>
        <div id="reviews-loading" class="text-center py-5">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        
        <div id="reviews-container" class="reviews-grid">
          <!-- Reviews injected here -->
        </div>
        
        <div id="empty-state" class="empty-reviews d-none">
          <h3>No reviews yet</h3>
          <p>Be the first to download a plan and leave a review!</p>
        </div>
      </section>
    </main>

    <!-- Footer injected here -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/app.js"></script>
    <script src="../scripts/reviews.js"></script>
  </body>
</html>
