<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildwise | Profile</title>
    <link rel="icon" type="image/png" href="../assets/logo/logo.png">
    
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css?v=7">
    <link rel="stylesheet" href="../styles/navbar.css?v=2">
    <link rel="stylesheet" href="../styles/utilities.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../styles/profile.css">
    <script src="../scripts/auth.js"></script>
</head>
<body>

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <main class="profile-page-content">
        <div class="container">
            <div class="profile-card">
                <div class="profile-avatar-large" id="profile-avatar">PA</div>
                <div class="profile-info">
                    <h1 id="profile-name">Project Administrator</h1>
                    <div class="role" id="profile-role">Admin</div>
                    <div class="email" id="profile-email">admin@buildwise.local</div>
                </div>
                
                <div class="status-card">
                    <div class="status-item">
                        <span>Projects Built</span>
                        <strong id="profile-projects">142</strong>
                    </div>
                    <div class="status-item">
                        <span>Status</span>
                        <strong style="color: #4CAF50;">Active</strong>
                    </div>
                    <div class="status-item">
                        <span>Join Date</span>
                        <strong id="profile-join-date">-</strong>
                    </div>
                </div>
                
                <div style="margin-top: 30px;">
                    <button class="btn btn-outline" onclick="Auth.clearSession()">Log Out</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="../scripts/app.js?v=7"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = Auth.getSession();
            if (!session) {
                window.location.href = '../login.html';
                return;
            }
            
            document.getElementById('profile-avatar').textContent = session.initials;
            document.getElementById('profile-name').textContent = session.name;
            document.getElementById('profile-role').textContent = session.role;
            document.getElementById('profile-email').textContent = session.email;
            document.getElementById('profile-projects').textContent = session.projects || 0;
            
            const joinDate = session.joinDate || session.created_at;
            if (joinDate) {
                const d = new Date(joinDate);
                document.getElementById('profile-join-date').textContent = d.toLocaleDateString();
            }
        });
    </script>
</body>
</html>
