<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buildwise | Customize Your Home</title>
    <link rel="icon" type="image/png" href="../assets/logo/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <!-- Styles -->
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css?v=7">
    <link rel="stylesheet" href="../styles/navbar.css?v=2">
    <link rel="stylesheet" href="../styles/utilities.css?v=2">
    <link rel="stylesheet" href="../styles/builder.css?v=3">
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="builder-page friendly-builder-page">
      <section class="container">
        <bw-progress current="2"></bw-progress>

        <div class="friendly-config">
          <aside class="home-summary-card">
            <a class="back-link" href="designs.html">Back</a>
            <span class="selected-pill" id="selectedPill">Selected Model</span>
            <h1 id="selectedTitle">Loft Style</h1>
            <p id="selectedDescription">Selected house model description.</p>
          </aside>

          <div id="configFormMount"></div>
          
          <!-- AI Overlay -->
          <div id="aiOverlay" class="ai-overlay" style="display: none;">
            <div class="ai-overlay-content">
              <div class="spinner-border text-light mb-3" role="status"></div>
              <h3 class="text-white mb-2">AI Architect is working...</h3>
              <p class="text-white-50">Please sit back while Gemini configures your optimal build.</p>
            </div>
          </div>
          
        </div>
      </section>
    </main>

    <div id="footer-container"></div>

    <script src="../scripts/app.js?v=7"></script>
    <script src="../components/progress.js"></script>

    <!-- Configure logic (ES module) -->
    <script type="module" src="../scripts/configure/configure.js"></script>
  </body>
</html>
